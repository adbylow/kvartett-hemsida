# The big photo at the top of the start page.
# Write the file name of a photo in the content/images folder.
hero_image: band-forest-landscape.jpg

# Optional: a portrait photo (taller than it is wide) used instead on phones.
# Leave it out to use hero_image on phones too.
hero_image_mobile: band-forest-portrait.jpg

# The photo on the "About" page.
about_image: band-night-landscape.jpg

# Spotify players on the start page (albums, playlists, songs or the artist page).
