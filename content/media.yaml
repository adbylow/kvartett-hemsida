#   credit:         photographer (optional)
photos:
  - image: band-night-landscape.jpg
    description_sv: Bandet står tätt tillsammans framför ett träd i mörkret.
    description_en: The band standing close together in front of a tree at night.
    credit: ""

  - image: band-forest-landscape.jpg
    description_sv: Bandet med sina instrument på en gräsmatta i skogen.
    description_en: The band with their instruments on a lawn in the forest.
    credit: ""

  - image: band-forest-portrait.jpg
    description_sv: Bandet spelar bland höga tallar.
    description_en: The band playing among tall pine trees.
    credit: ""

  - image: band-night-portrait.jpg
    description_sv: Bandet i rockar under ett stort träd en kväll.
    description_en: The band in coats under a large tree in the evening.
    credit: ""

